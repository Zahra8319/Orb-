<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Snake</title>
<style>html,body{margin:0;height:100%;background:#061f4a;color:#fff;font:16px system-ui,sans-serif;display:grid;place-items:center}
canvas{width:min(100vw,100vh);height:min(100vw,100vh);touch-action:none;background:#0b2a63}
#s{position:fixed;top:8px;left:12px}</style></head><body>
<div id="s">Score 0</div><canvas id="c" width="400" height="400"></canvas>
<script>
const c=document.getElementById('c'),x=c.getContext('2d'),N=20,S=20,sc=document.getElementById('s');
let sn,d,nd,f,score,t,over;
function reset(){sn=[{x:10,y:10},{x:9,y:10},{x:8,y:10}];d=nd={x:1,y:0};score=0;over=false;food();sc.textContent='Score 0'}
function food(){do{f={x:Math.random()*N|0,y:Math.random()*N|0}}while(sn.some(p=>p.x==f.x&&p.y==f.y))}
function turn(n){if(n.x!==-d.x||n.y!==-d.y)nd=n}
addEventListener('keydown',e=>{const m={ArrowUp:{x:0,y:-1},ArrowDown:{x:0,y:1},ArrowLeft:{x:-1,y:0},ArrowRight:{x:1,y:0}}[e.key];
 if(m){e.preventDefault();turn(m)}else if(over&&e.key==' ')reset()});
let sx,sy;c.addEventListener('pointerdown',e=>{sx=e.clientX;sy=e.clientY;if(over)reset()});
c.addEventListener('pointerup',e=>{const dx=e.clientX-sx,dy=e.clientY-sy;if(Math.max(Math.abs(dx),Math.abs(dy))<20)return;
 turn(Math.abs(dx)>Math.abs(dy)?{x:Math.sign(dx),y:0}:{x:0,y:Math.sign(dy)})});
function step(){if(over)return;d=nd;const h={x:sn[0].x+d.x,y:sn[0].y+d.y};
 if(h.x<0||h.y<0||h.x>=N||h.y>=N||sn.some(p=>p.x==h.x&&p.y==h.y)){over=true;return}
 sn.unshift(h);if(h.x==f.x&&h.y==f.y){score++;sc.textContent='Score '+score;food()}else sn.pop()}
function draw(){x.clearRect(0,0,400,400);x.fillStyle='#fc3d21';x.fillRect(f.x*S,f.y*S,S-2,S-2);
 x.fillStyle='#02bfe7';sn.forEach(p=>x.fillRect(p.x*S,p.y*S,S-2,S-2));
 if(over){x.fillStyle='rgba(0,0,0,.6)';x.fillRect(0,0,400,400);x.fillStyle='#fff';x.font='24px system-ui';x.textAlign='center';
 x.fillText('Game over. Tap or press Space',200,205)}}
reset();setInterval(()=>{step();draw()},110);
</script></body></html>
