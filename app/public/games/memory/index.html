<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Memory Match</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧠</text></svg>">
<link rel="stylesheet" href="../orb-kit.css">
<style>
  .board { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .card {
    aspect-ratio: 1; border: none; border-radius: 12px; cursor: pointer; padding: 0;
    font-size: clamp(24px, 9vw, 40px); color: transparent;
    background: rgba(255,255,255,.09);
    box-shadow: inset 0 3px 0 rgba(255,255,255,.10), inset 0 -3px 0 rgba(0,0,0,.30);
    transition: background .15s ease, transform .12s ease;
  }
  .card::after { content: '✦'; color: rgba(255,255,255,.18); font-size: .6em; }
  .card.open, .card.done { color: inherit; }
  .card.open::after, .card.done::after { content: none; }
  .card.open { background: #f1f5fb; }
  .card.done { background: #ffd76e; box-shadow: 0 0 14px rgba(255,215,110,.5), inset 0 -3px 0 rgba(170,105,0,.35); }
  .card:active { transform: scale(.94); }
</style>
<script src="../orb-kit.js"></script>
<script src="../orb-bridge.js"></script>
</head>
<body>

<div class="panel">
  <div class="topbar">
    <div class="stat"><small>MOVES</small><span id="hud-moves">0</span></div>
    <div class="stat"><small>PAIRS</small><span id="hud-pairs">0/8</span></div>
    <div class="stat"><small>BEST</small><span id="hud-best">—</span></div>
    <button class="mute-btn" id="mute-btn"></button>
  </div>

  <div class="board-area"><div class="board" id="board"></div></div>

  <div class="actions">
    <button class="btn-ghost" id="btn-restart">NEW GAME</button>
  </div>

  <div class="overlay hidden" id="over-overlay">
    <div class="icon-big">🎉</div>
    <div class="over-title">ALL PAIRS FOUND</div>
    <div class="final-line" id="final-line"></div>
    <div class="new-record hidden" id="new-record">🏆 NEW RECORD!</div>
    <div class="over-sub" id="over-best"></div>
    <div class="over-btns"><button class="btn-primary" id="btn-again">PLAY AGAIN</button></div>
  </div>

  <div class="overlay" id="start-overlay">
    <div class="icon-big">🧠</div>
    <div class="over-title">MEMORY MATCH</div>
    <div class="over-sub">Sixteen cards hide eight pairs.<br>Flip two at a time; a match stays face up.<br>Find them all in as few moves as you can.</div>
    <div class="over-sub" id="start-best"></div>
    <button class="start-btn btn-primary" id="btn-start">START</button>
  </div>
</div>

<div class="footer">Made for Orb</div>

<script>
(function () {
  'use strict';
  var FACES = ['🚀', '🌍', '🌙', '⭐', '🛰️', '☄️', '🪐', '👩‍🚀'];
  var K = OrbKit, sfx = K.sfx;
  var best = K.best('orb_memory_best', function (a, b) { return a < b; });
  var $ = function (id) { return document.getElementById(id); };
  var board = $('board');
  var open = [], moves = 0, found = 0, lock = false;

  function hud() {
    $('hud-moves').textContent = moves;
    $('hud-pairs').textContent = found + '/' + FACES.length;
    var b = best.get();
    $('hud-best').textContent = b === null ? '—' : b;
    $('start-best').textContent = b === null ? '' : 'Best: ' + b + ' moves';
  }

  function deal() {
    board.innerHTML = '';
    open = []; moves = 0; found = 0; lock = false;
    var deck = FACES.concat(FACES);
    for (var i = deck.length - 1; i > 0; i--) { var j = Math.random() * (i + 1) | 0; var t = deck[i]; deck[i] = deck[j]; deck[j] = t; }
    deck.forEach(function (face, i) {
      var b = document.createElement('button');
      b.className = 'card';
      b.dataset.face = face;
      b.setAttribute('aria-label', 'Card ' + (i + 1) + ', face down');
      b.addEventListener('click', function () { flip(b); });
      board.appendChild(b);
    });
    hud();
  }

  function flip(b) {
    if (lock || b.classList.contains('open') || b.classList.contains('done')) return;
    sfx.tap();
    b.classList.add('open');
    b.textContent = b.dataset.face;
    b.setAttribute('aria-label', b.dataset.face);
    open.push(b);
    if (open.length < 2) return;
    moves++;
    var a = open[0], c = open[1];
    open = [];
    if (a.dataset.face === c.dataset.face) {
      a.className = c.className = 'card done';
      found++;
      sfx.good();
      hud();
      if (found === FACES.length) setTimeout(won, 350);
    } else {
      lock = true;
      hud();
      setTimeout(function () {
        [a, c].forEach(function (k) { k.className = 'card'; k.textContent = ''; k.setAttribute('aria-label', 'Card face down'); });
        lock = false;
      }, 750);
    }
  }

  function won() {
    sfx.win();
    var rec = best.offer(moves);
    if (window.OrbBridge) OrbBridge.result(moves, moves + ' moves');
    hud();
    $('final-line').textContent = 'Solved in ' + moves + ' moves';
    $('new-record').classList.toggle('hidden', !rec);
    $('over-best').textContent = 'Best: ' + best.get() + ' moves';
    K.show($('over-overlay'));
  }

  function start() {
    deal();
    K.hide($('start-overlay')); K.hide($('over-overlay'));
    var first = board.querySelector('button'); if (first) first.focus({ preventScroll: true });
  }

  $('btn-start').addEventListener('click', start);
  $('btn-again').addEventListener('click', start);
  $('btn-restart').addEventListener('click', start);
  K.bindMute($('mute-btn'));
  deal();
})();
</script>
</body>
</html>
