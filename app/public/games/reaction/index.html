<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reaction Rush</title>
<style>html,body{margin:0;height:100%;font:18px system-ui,sans-serif;color:#fff}
#p{width:100%;height:100%;border:0;font:inherit;color:inherit;background:#0b3d91;cursor:pointer;padding:24px}
#p.go{background:#0a8f4a}#p.bad{background:#fc3d21}#p:focus-visible{outline:4px solid #ff9d1e;outline-offset:-4px}</style></head><body>
<button id="p" aria-live="polite">Tap to start. Wait for green, then tap fast.</button>
<script>
const p=document.getElementById('p');let st='idle',t0,to,best=null;
try{best=Number(localStorage.getItem('reactionBest'))||null}catch(e){}
function msg(t,c){p.textContent=t;p.className=c||''}
p.onclick=()=>{
 if(st==='idle'){st='wait';msg('Wait for green...');to=setTimeout(()=>{st='go';t0=performance.now();msg('TAP NOW!','go')},1000+Math.random()*3000)}
 else if(st==='wait'){clearTimeout(to);st='idle';msg('Too soon! Tap to try again.','bad')}
 else{const ms=Math.round(performance.now()-t0);st='idle';if(!best||ms<best){best=ms;try{localStorage.setItem('reactionBest',ms)}catch(e){}}
  msg(ms+' ms. Best '+best+' ms. Tap to play again.')}}
</script></body></html>
